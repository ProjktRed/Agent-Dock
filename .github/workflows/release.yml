# Signed release: pushing a tag vX.Y.Z (matching package.json) builds the Windows app, the per-user
# installer and a zip, signs a manifest of the zip with the RELEASE_SIGNING_KEY secret (Ed25519) and
# publishes a GitHub Release in this repository with the workflow's own token. Installed apps verify
# the signature before updating.
# Then (0.33) a Linux job builds the AppImage, signs its own manifest (manifest-linux-x64.json/.sig)
# and adds them to the same release. It runs after the Windows release, so a Linux build problem
# never holds back the Windows update.
# Run it by hand (Actions › Release › Run workflow, once this file is on the default branch) or push a
# tag ending in -dry (v0.24.2-dry) for a dry run: the same checks and build, with the
# installer and zip attached to the run as an artifact; nothing is signed or published.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # gh release create in this repository

env:
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' || endsWith(github.ref_name, '-dry') }}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # Release notes list the commits since the previous tag.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Version
        shell: bash
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - name: Signing key, release key and tag
        if: env.DRY_RUN != 'true'
        shell: bash
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          test -n "$RELEASE_SIGNING_KEY" || { echo "::error::Add the repository secret RELEASE_SIGNING_KEY (see scripts/sign-release.mjs)"; exit 1; }
          # A build without the public key could never verify, and so never install, its own updates.
          grep -q 'BEGIN PUBLIC KEY' src/main/release-key.ts || { echo "::error::Put the release public key in src/main/release-key.ts before tagging"; exit 1; }
          [ "v$VERSION" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"; exit 1; }
      - name: Git identity for test repositories
        run: |
          git config --global user.email "ci@agent-dock.invalid"
          git config --global user.name "Agent Dock CI"
          git config --global init.defaultBranch master
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:engine
      - name: Icon
        run: node -e "import('./scripts/logo.mjs').then(m=>{require('fs').mkdirSync('build',{recursive:true});require('fs').writeFileSync('build/icon.png',m.logoPng(256))})"
      - name: Build
        env:
          AGENT_DOCK_BUILD_SOURCE: https://github.com/${{ github.repository }}
          AGENT_DOCK_BUILD_BRANCH: release
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run package:installer
      - name: Packaged security (fuses, bundled Node, debug switches refused)
        run: node scripts/verify-packaged-security.mjs dist/win-unpacked/AgentDock.exe
      - name: Swap script is bundled
        shell: bash
        run: test -f dist/win-unpacked/resources/scripts/swap.mjs
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/win-unpacked/* -DestinationPath "AgentDock-$env:VERSION-win-x64.zip"
      - name: Dry run artifact
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: AgentDock-${{ env.VERSION }}-dry-run
          path: |
            dist/AgentDock-Setup-${{ env.VERSION }}-win-x64.exe
            AgentDock-${{ env.VERSION }}-win-x64.zip
          retention-days: 7
      - name: File index and the files changed since the previous release
        if: env.DRY_RUN != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          index="AgentDock-$VERSION-win-x64.files.json"
          node scripts/release-delta.mjs index --dir dist/win-unpacked --out "$index"
          echo "SIGN_EXTRA=--index $index" >> "$GITHUB_ENV"
          echo "INDEX_FILE=$index" >> "$GITHUB_ENV"
          previous=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "$GITHUB_REF_NAME" | head -1 || true)
          from="${previous#v}"
          # Releases before 0.33 have no index, so deltas start with the release after 0.33.
          if [ -n "$previous" ] && gh release download "$previous" --repo "$GITHUB_REPOSITORY" --pattern "AgentDock-$from-win-x64.files.json" --dir previous; then
            # The previous release's files, so large changed files (the exe) can ship as binary patches.
            previous_dir=""
            if gh release download "$previous" --repo "$GITHUB_REPOSITORY" --pattern "AgentDock-$from-win-x64.zip" --dir previous; then
              pwsh -NoProfile -Command "Expand-Archive -LiteralPath 'previous/AgentDock-$from-win-x64.zip' -DestinationPath previous/app -Force" && previous_dir="previous/app"
              [ -f "$previous_dir/win-unpacked/AgentDock.exe" ] && previous_dir="$previous_dir/win-unpacked"
            fi
            node scripts/release-delta.mjs changed --dir dist/win-unpacked --index "$index" --previous "previous/AgentDock-$from-win-x64.files.json" --out delta ${previous_dir:+--previous-dir "$previous_dir"}
            if [ -n "$(ls -A delta 2>/dev/null)" ]; then
              delta="AgentDock-$VERSION-from-$from-win-x64.zip"
              pwsh -NoProfile -Command "Compress-Archive -Path delta/* -DestinationPath '$delta'"
              echo "SIGN_EXTRA=--index $index --delta $delta --delta-from $from" >> "$GITHUB_ENV"
              echo "DELTA_ZIP=$delta" >> "$GITHUB_ENV"
            fi
          fi
      - name: Sign
        if: env.DRY_RUN != 'true'
        shell: bash
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: node scripts/sign-release.mjs --zip "AgentDock-$VERSION-win-x64.zip" --version "$VERSION" --commit "$GITHUB_SHA" --out . $SIGN_EXTRA
      - name: Release notes
        if: env.DRY_RUN != 'true'
        shell: bash
        run: |
          previous=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          installer="AgentDock-Setup-$VERSION-win-x64.exe"
          {
            echo "Install: download $installer and run it (per user, no admin rights). Windows may warn about an unknown publisher: choose More info, then Run anyway."
            echo
            echo "Installed apps update themselves from this page and install only releases signed with the Agent Dock release key."
            echo
            echo "SHA-256 of $installer: $(sha256sum "dist/$installer" | cut -d' ' -f1)"
            echo
            echo "## Changes"
            # Hand-written notes in docs/release-notes/<version>.md when present; otherwise the commit titles.
            if [ -f "docs/release-notes/$VERSION.md" ]; then cat "docs/release-notes/$VERSION.md"
            else git log --no-merges --format='%s' ${previous:+"$previous..$GITHUB_REF_NAME"} | sed -E 's/^Beta [0-9.]+: //; s/^/- /' | head -30; fi
          } > notes.md
      - name: Publish
        if: env.DRY_RUN != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "dist/AgentDock-Setup-$VERSION-win-x64.exe" "AgentDock-$VERSION-win-x64.zip" manifest.json manifest.sig "$INDEX_FILE" ${DELTA_ZIP:+"$DELTA_ZIP"} --title "Agent Dock $VERSION" --notes-file notes.md

  linux:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Icon
        run: node -e "import('./scripts/logo.mjs').then(m=>{require('fs').mkdirSync('build',{recursive:true});require('fs').writeFileSync('build/icon.png',m.logoPng(256))})"
      - name: Build AppImage
        env:
          AGENT_DOCK_BUILD_SOURCE: https://github.com/${{ github.repository }}
          AGENT_DOCK_BUILD_BRANCH: release
        run: npm run package:appimage
      - name: Packaged security (fuses, bundled Node, debug switches refused)
        # Headless runner: a virtual display, and no Chromium sandbox (unprivileged namespaces are off there).
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
        run: xvfb-run -a node scripts/verify-packaged-security.mjs dist/linux-unpacked/AgentDock
      - name: Dry run artifact
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: AgentDock-${{ env.VERSION }}-linux-dry-run
          path: dist/AgentDock-${{ env.VERSION }}-linux-x86_64.AppImage
          retention-days: 7
      - name: AppImage patch from the previous release
        # 0.38: a binary patch of the previous release's AppImage (scripts/release-delta.mjs appimage), signed
        # into the manifest. Apps on exactly that version download it instead of the whole AppImage.
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 20 --json tagName --jq '.[].tagName' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "$GITHUB_REF_NAME" | sort -V -r | head -1 || true)
          from="${previous#v}"
          if [ -n "$previous" ] && gh release download "$previous" --repo "$GITHUB_REPOSITORY" --pattern "AgentDock-$from-linux-x86_64.AppImage" --dir previous; then
            patch="AgentDock-$VERSION-from-$from-linux-x86_64.adpatch"
            node scripts/release-delta.mjs appimage --previous "previous/AgentDock-$from-linux-x86_64.AppImage" --file "dist/AgentDock-$VERSION-linux-x86_64.AppImage" --out "$patch"
            if [ -f "$patch" ]; then
              echo "SIGN_EXTRA=--delta $patch --delta-from $from" >> "$GITHUB_ENV"
              echo "LINUX_PATCH=$patch" >> "$GITHUB_ENV"
            fi
          fi
      - name: Sign
        if: env.DRY_RUN != 'true'
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: node scripts/sign-release.mjs --platform linux-x64 --zip "dist/AgentDock-$VERSION-linux-x86_64.AppImage" --version "$VERSION" --commit "$GITHUB_SHA" --out . $SIGN_EXTRA
      - name: Add to the release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "dist/AgentDock-$VERSION-linux-x86_64.AppImage" manifest-linux-x64.json manifest-linux-x64.sig ${LINUX_PATCH:+"$LINUX_PATCH"}
